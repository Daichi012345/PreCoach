
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: precoach
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PRECOACH_USER_PASSWORD: ${PRECOACH_USER_PASSWORD:?Set PRECOACH_USER_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d precoach"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  front:
    build:
      context: ./front
    ports:
      - "0.0.0.0:5173:5173"
    volumes:
      - ./front:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - back
    networks:
      - app-network

  back:
    build:
      context: ./back
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - ./back:/app
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
    command: uvicorn main:app --host 0.0.0.0 --reload
    networks:
      - app-network



networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:

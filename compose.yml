
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: precoach
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PRECOACH_USER_PASSWORD: ${PRECOACH_USER_PASSWORD:?Set PRECOACH_USER_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d precoach"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  front:
    build:
      context: ./front
    ports:
      - "0.0.0.0:5173:5173"
    volumes:
      - ./front:/app
      - /app/node_modules
    environment:
      VITE_HOST: ${VITE_HOST:-0.0.0.0}
      VITE_PORT: ${VITE_PORT:-5173}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - back
    networks:
      - app-network

  back:
    build:
      context: ./back
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - ./back:/app
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      DATABASE_URL: postgresql+psycopg://precoach_user:${PRECOACH_USER_PASSWORD}@postgres:5432/precoach
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-https?://(localhost|127\.0\.0\.1|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[0-1])\.\d+\.\d+)(:\d+)?}
    command: uvicorn main:app --host 0.0.0.0 --reload
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network



networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:

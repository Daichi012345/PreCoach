
services:
  front:
    build:
      context: ./front
    ports:
      - "5173:5173"
    volumes:
      - ./front:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - back

  back:
    build:
      context: ./back
    ports:
      - "8000:8000"
    volumes:
      - ./back:/app
    command: uvicorn main:app --host 0.0.0.0 --reload

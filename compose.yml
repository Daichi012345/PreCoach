
services:
  front:
    build:
      context: ./front
    ports:
      - "0.0.0.0:5173:5173"
    volumes:
      - ./front:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - back
    networks:
      - app-network

  back:
    build:
      context: ./back
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - ./back:/app
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
    command: uvicorn main:app --host 0.0.0.0 --reload
    networks:
      - app-network



networks:
  app-network:
    driver: bridge
